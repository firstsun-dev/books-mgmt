name: Kavita Collection Sync
# Description: Sync physical folder structure to Kavita collections automatically.

on:
  schedule:
    - cron: '0 0 * * *' # 每天凌晨執行一次
  workflow_dispatch: # 允許手動執行

jobs:
  sync:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Run Kavita Manager
        env:
          KAVITA_URL: ${{ vars.KAVITA_URL }}
          KAVITA_API_KEY: ${{ secrets.KAVITA_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: uv run kavita_manager.py
